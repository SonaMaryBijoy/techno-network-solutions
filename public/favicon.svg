<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Clean rounded white container so logo pops on both light & dark browser tabs -->
  <rect width="512" height="512" rx="120" fill="#ffffff" />

  <g transform="translate(10, 10)">
    <!-- Blue Slanted T/Z Emblem -->
    <path d="M 245 105 H 395 L 345 165 H 290 L 180 335 H 335 L 295 395 H 110 L 235 215 H 180 Z" fill="#009fe3" />

    <!-- Purple Horizontal Parallelogram Crossbar -->
    <path d="M 125 215 L 85 270 H 420 L 460 215 Z" fill="#672d8e" />

    <!-- Dark Purple Intersection Blend -->
    <path d="M 235 215 H 300 L 260 270 H 195 Z" fill="#431c63" opacity="0.95" />
  </g>
</svg>