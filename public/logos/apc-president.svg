<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 85" fill="none">
  <!-- PRESIDENT side -->
  <g transform="translate(0, 5)">
    <ellipse cx="70" cy="22" rx="64" ry="16" stroke="#dc2626" stroke-width="2" fill="none"/>
    <text x="18" y="27" font-family="'Impact', sans-serif" font-weight="900" font-size="20" fill="#dc2626" letter-spacing="1">PRESIDENT</text>
    <text x="12" y="48" font-family="sans-serif" font-weight="bold" font-size="8" fill="#475569">Solutions beyond enclosures</text>
  </g>
  
  <!-- APC by Schneider Electric side -->
  <g transform="translate(165, 0)">
    <rect x="0" y="0" width="145" height="75" rx="8" fill="#16a34a"/>
    <text x="12" y="20" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff">President</text>
    <text x="12" y="32" font-family="sans-serif" font-size="9" fill="#dcfce7">is becoming</text>
    <text x="12" y="58" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="1">APC</text>
    <text x="12" y="68" font-family="sans-serif" font-weight="bold" font-size="7" fill="#dcfce7">by Schneider Electric</text>
  </g>
</svg>
